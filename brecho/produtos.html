<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peças · Brechó da Família Guimarães</title>
  <meta name="description" content="Acervo do Brechó da Família Guimarães: vestidos, jaquetas, bolsas, sapatos, acessórios, louças, discos e livros vintage dos anos 70, 80 e 90.">
  <meta name="theme-color" content="#f7f1e6">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/brecho.css">
  <script>try{if(JSON.parse(localStorage.getItem("brecho-tema"))==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
</head>
<body data-page="produtos">
  <div class="topbar">Reservas pelo WhatsApp · <strong>peças únicas</strong> guardadas por 48 h</div>
  <header id="site-header"></header>

  <main>
    <section class="page-head">
      <div class="wrap">
        <span class="eyebrow">Acervo</span>
        <h1>Nossas peças <em>especiais</em></h1>
        <p>Cada item tem uma história para contar. Use os filtros para achar o seu tamanho, a sua década e o seu estilo — e corra, porque não existe segunda unidade.</p>
      </div>
    </section>

    <div class="wrap shop">
      <aside class="filters" id="filters" aria-label="Filtros">
        <div class="filters-head">
          <h2>Filtros</h2>
          <button class="icon-btn filters-close-only" type="button" id="filtersClose" aria-label="Fechar filtros">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <fieldset class="f-group"><legend>Categoria</legend><div class="chips" id="fCategoria"></div></fieldset>
        <fieldset class="f-group"><legend>Tamanho</legend><div class="chips" id="fTamanho"></div></fieldset>
        <fieldset class="f-group"><legend>Década</legend><div class="chips" id="fDecada"></div></fieldset>
        <div class="f-group">
          <h3><label for="fPreco">Preço máximo</label></h3>
          <div class="range-row"><span>R$ 0</span><b id="fPrecoOut">Qualquer</b></div>
          <input type="range" id="fPreco" min="40" max="260" step="10" value="260">
        </div>
        <div class="f-group">
          <label class="switch"><input type="checkbox" id="fDisp"> Mostrar só peças disponíveis</label>
        </div>
        <div class="filters-actions">
          <button class="btn btn-ghost" type="button" id="clearAll">Limpar</button>
          <button class="btn apply" type="button" id="applyFilters">Ver peças</button>
        </div>
      </aside>

      <section aria-label="Resultados">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <label class="sr-only" for="q">Buscar peças</label>
            <input class="field" id="q" type="search" placeholder="Buscar: vestido, couro, vinil…" autocomplete="off" maxlength="60">
          </div>
          <label class="sr-only" for="sort">Ordenar por</label>
          <select class="field sort" id="sort">
            <option value="destaque">Destaques</option>
            <option value="menor">Menor preço</option>
            <option value="maior">Maior preço</option>
            <option value="desconto">Maior desconto</option>
            <option value="decada">Década (mais antigas)</option>
          </select>
          <button class="btn btn-ghost filter-toggle" type="button" id="filtersOpen" aria-controls="filters" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filtros <span id="fCount"></span>
          </button>
        </div>
        <div class="result-info">
          <span id="resultCount" aria-live="polite"></span>
          <div class="active-tags" id="activeTags"></div>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="data/produtos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/loja.js"></script>
  <script src="../assets/js/hub.js" defer></script>
</body>
</html>
